services:
  kana-backend:
    container_name: kana-backend
    image: kana-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - UMASK=${UMASK}
      - TZ=${TZ}
      - PGHOST=${PGHOST}
      - PGPORT=${PGPORT}
      - PGSSLMODE=${PGSSLMODE}
      - PGDATABASE=${PGDATABASE}
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_SECRET_SALT=${SESSION_SECRET_SALT}
      - SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN}
      - SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME}
      - DEVICE_ID_COOKIE_NAME=${DEVICE_ID_COOKIE_NAME}
      - VITE_SESSION_COOKIE_DATA_NAME=${VITE_SESSION_COOKIE_DATA_NAME}
      - CORS_VALID_ORIGINS=${CORS_VALID_ORIGINS}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL}
    restart: on-failure:3
    user: '${PUID}:${PGID}'
    networks:
      - tunneled

networks:
  tunneled:
    external: true
    name: tunneled
